services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # healthcheck:
    #   test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-p", "1883", "-t", "$$SYS/#", "-W", "2"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    healthcheck:
      test:
        - CMD-SHELL
        - "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ping"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - traffic-network

  receiver:
    build: .
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    ports:
      - "127.0.0.1:5119:5119"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5119/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - traffic-network

  sender:
    build: .
    command: python quantum_sender.py
    restart: "no"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    # depends_on:
    #   mosquitto:
    #     condition: service_healthy
    #   receiver:
    #     condition: service_started
    depends_on:
      mosquitto:
        condition: service_healthy
      receiver:
        condition: service_healthy
    networks:
      - traffic-network

networks:
  traffic-network:
    driver: bridge